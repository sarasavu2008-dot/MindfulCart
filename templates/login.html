<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <title>Login - MindfulCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card p-4 shadow" style="width: 350px;">
        <h3 class="text-center text-success mb-4">Login MindfulCart 💭🛒</h3>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category,message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}


        <form action="/login" method="POST">
            <div class="mb-3">
                <label>Nume utilizator</label>
                <input type="text" class="form-control" name="username" required>

            </div>
            <div class="mb-3">
                <label>Parolă</label>
                <input type="password" class="form-control" name="password"  required>
            </div>
            <button type="submit" class="btn btn-success w-100">Intră in cont</button>
        </form>
        <p class="text-center mt-3 small">Nu ai cont? <a href="/register">Creează unul</a></p>
    </div>
</body>
</html>
